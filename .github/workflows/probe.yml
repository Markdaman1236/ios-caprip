name: probe
on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        image: [macos-14, macos-15, macos-latest]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 10
    steps:
      - name: What is this runner, and which Xcodes does it have?
        run: |
          echo "requested label: ${{ matrix.image }}"
          sw_vers
          uname -m
          echo "--- Xcodes installed ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "none"
          echo "--- selected by the build's rule (lowest version) ---"
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | head -1)
          echo "XC=$XC"
          if [ -n "$XC" ]; then
            DEVELOPER_DIR="$XC/Contents/Developer" xcodebuild -version
            DEVELOPER_DIR="$XC/Contents/Developer" xcrun --find iig || echo "no iig"
          fi
          echo "--- default xcode ---"
          xcodebuild -version
